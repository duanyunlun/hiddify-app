name: Release

# Manual trigger only.
#
# This fork deliberately has NO tag/push trigger, so publishing a tag does not
# start a build. Run it from the Actions tab when you want release artefacts.
on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Release tag to build and publish (e.g. v4.1.0-f1)"
        type: string
        required: true
        default: "draft"
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: "prod"
        options:
          - prod
          - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ inputs.tag-name }}"
      channel: "${{ inputs.channel }}"
