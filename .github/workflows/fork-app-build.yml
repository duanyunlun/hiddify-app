name: Build fork packages

# Manual trigger only: this fork must never build on a push or on a tag, because
# every run consumes the account's Actions minutes.
#
# Builds only what this fork needs and is meant for personal use:
#   - Android APK
#   - Windows portable zip
# macOS and iOS are intentionally not built. The steps avoid `make` and call the
# underlying commands directly, so the workflow does not depend on a make binary
# being present on the runner.
#
# The core binaries come from a fork release (CORE_REPO/CORE_TAG), so the
# packages carry this fork's core changes instead of upstream's.
on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: "Repository that hosts the core release"
        type: string
        required: true
        default: "duanyunlun/hiddify-core"
      core_tag:
        description: "Core release tag (e.g. v4.1.0-f1)"
        type: string
        required: true
        default: "v4.1.0-f1"
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: "prod"
        options:
          - prod
          - dev
      release_tag:
        description: "Tag to publish the packages to (a release is created if needed)"
        type: string
        required: true
        default: "v4.1.0-f1-app"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.5"
  CORE_REPO: "${{ inputs.core_repo }}"
  CORE_TAG: "${{ inputs.core_tag }}"
  TARGET: "lib/main_prod.dart"

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # Do not use android-actions/setup-android: it tries to install the
      # long-removed "tools" package and fails with "Failed to find package
      # 'tools'". The runner image already ships the SDK, so only make sure the
      # platform and build-tools this project declares are present
      # (android/app/build.gradle: compileSdkVersion 36, targetSdkVersion 36).
      - name: Setup Android SDK
        # Non-fatal: the runner image already ships an SDK, so a failure here
        # must not stop the build. Gradle reports a genuinely missing component.
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK; relying on what the image provides"
          else
            echo "using $SDKMGR"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      # No Android NDK: the app consumes the core as a prebuilt AAR, and no
      # plugin compiles native code, so Gradle does not need an NDK.

      - name: Fetch core binaries
        run: |
          set -e
          mkdir -p hiddify-core/bin android/app/libs
          curl -fL --retry 5 --retry-all-errors \
            -o core-android.tar.gz \
            "https://github.com/${CORE_REPO}/releases/download/${CORE_TAG}/hiddify-lib-android.tar.gz"
          tar -xzf core-android.tar.gz -C android/app/libs
          ls -lh android/app/libs

      - name: Flutter deps and code generation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        run: flutter build apk --release --target ${{ env.TARGET }}

      - name: Collect package
        run: |
          set -e
          mkdir -p out
          find build/app/outputs -type f -name "*.apk" -exec cp -v {} out/ \;
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: Hiddify-Android-apk
          path: out/*
          retention-days: 7

      # Also publish to the release so the package has a stable download URL.
      # Downloading an Actions artifact needs an authenticated API call and
      # redirect handling, which is awkward to automate; a release asset is a
      # plain HTTPS download.
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out/*
          fail_on_unmatched_files: false

  windows-zip:
    name: Windows portable
    # Pin the 2022 image on purpose. On windows-latest the toolchain is Visual
    # Studio 18 (v180) and the sentry-native CMake step that sentry_flutter pulls
    # in fails there with MSB3073; the build succeeds with the Visual Studio 2022
    # toolchain (v143), which this image provides.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Fetch core binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hiddify-core/bin | Out-Null
          $url = "https://github.com/$env:CORE_REPO/releases/download/$env:CORE_TAG/hiddify-lib-windows-amd64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile core-win.tar.gz
          tar -xzf core-win.tar.gz -C hiddify-core/bin
          Get-ChildItem hiddify-core/bin

      # ffigen needs hiddify-core/bin/desktop.h. The fork's core release ships the
      # cgo-generated header alongside the library precisely so this build does
      # not need a C toolchain (generating it here would require mingw-w64 on the
      # runner and `make headers` is unusable: it points at platform/desktop2,
      # which does not exist).
      - name: Provide core header for ffigen
        shell: pwsh
        run: |
          if (-not (Test-Path hiddify-core/bin/desktop.h)) {
            throw "hiddify-core/bin/desktop.h is missing from the core release ${env:CORE_TAG}; rebuild the core release with fork-build.yml"
          }
          Get-Content hiddify-core/bin/desktop.h -TotalCount 3

      - name: Flutter deps and code generation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build portable package
        shell: pwsh
        run: |
          flutter build windows --release --target ${{ env.TARGET }} --dart-define=portable=true
          $stage = "out/Hiddify"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/hiddify_portable_data" | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "out/Hiddify-Windows-portable.zip" -CompressionLevel Optimal
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Hiddify-Windows-Portable
          path: out/*.zip
          retention-days: 7

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out/*.zip
          fail_on_unmatched_files: false
