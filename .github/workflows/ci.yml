name: CI

# Manual trigger only.
#
# This fork deliberately has NO automatic trigger (no push, no pull_request, no
# schedule): every run consumes the account's Actions minutes. Start a build from
# the Actions tab ("Run workflow") when you actually want one.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: "dev"
        options:
          - dev
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ github.ref_name }}"
      channel: "${{ inputs.channel }}"
